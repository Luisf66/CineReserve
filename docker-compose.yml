services:

    cinereserve_web:
      build: .
      restart: always
      ports:
        - 8000:8000
      depends_on:
        - cinereserve_db
      env_file:
        - .env
      
    cinereserve_db:
      image: postgres:15
      ports:
        - 15432:5432
      volumes:
        - cinereserve_postgres_data:/var/lib/postgresql/data/
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=cinereserve

volumes:
  cinereserve_postgres_data: