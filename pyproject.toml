[project]
name = "cinereserve"
version = "0.1.0"
description = "REST API for cinema ticket reservation system"
authors = [
    {name = "Luisf66",email = "Luisf311220@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "djangorestframework (>=3.17.0,<4.0.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
